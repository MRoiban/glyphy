# Glyphy project. `glyphy measure` rewrites the measured [style] values from the
# reference icons, except keys listed in style.locked. Everything is editable;
# any [style] or [trace] key can be overridden per glyph in [glyphs.<name>].
# Units are grid units unless noted.
[style]
grid = 16
stroke = 1.0
stroke_tolerance = 0.12
letter_stroke = [
    0.95,
    1.45,
]
letter_stroke_target = 1.2
live = 14.0
letter_height = 11.91
pad_min = 0.75
centring_max = 0.5
crisp_reference = 0.6
roughness_reference = 0.24
roughness_max = 0.0
locked = []

[trace]
method = "vector"
work_scale = 64
threshold = 128
speck = 0.25
fit = true
correct = true
stroke_shape = "cross"
mitre_limit = 2.0
rounds = 5
stroke_epsilon = 0.04
smooth = 0.0
svg_as_drawn = true
snap_mode = "corners"
snap = 0.3
straighten = 4.0
offsets = 4
centring_weight = 0.0
choose = "crisp"
weight_crisp_2x = 1.0
weight_drift = 0.5
weight_spread = 1.0
weight_rough = 1.0
turdsize = 16
alphamax = 0.9
opticurve = true
opttolerance = 0.2
decimals = 3
corner_deg = 32.0
corner_scale = 0.12
line_tol = 0.03
min_line = 0.25
curve_tol = 0.025
snap_deg = 2.5
parallel_deg = 2.0
max_extend = 0.5
straight_min = 0.5
vector_mitre_limit = 4.0
hint = false
hint_min_len = 0.5

[paths]
reference = "reference"
generated = "generated"
traced = "traced"
picked = "glyphs"
out = "out"

[brief]
variants = 2
image_size = 1024
notes = ""
template = ""

[glyphs.heading]
concept = "a geometric sans-serif capital \"H\""
kind = "letter"
replaces = "symbol-keyword"

[glyphs.math-inline]
concept = "an italic lowercase \"x\" with a small superscript \"2\""
kind = "letter"
replaces = "symbol-operator"

[glyphs.math-display]
concept = "a capital sigma between a line above and a line below"
kind = "letter"
replaces = "symbol-numeric"

[glyphs.comment-toggle]
concept = "two forward slashes followed by a short horizontal line"
kind = "letter"
replaces = "comment"

[glyphs.follow-cursor]
concept = "a text I-beam cursor inside four corner brackets"
kind = "icon"
replaces = "link"

[glyphs.section]
concept = "the section sign §"
kind = "letter"
replaces = "symbol-namespace"

[glyphs.theme-light]
concept = "a sun: a circle with 8 short rays"
kind = "icon"
replaces = "lightbulb"

[glyphs.theme-dark]
concept = "a crescent moon"
kind = "icon"
replaces = "color-mode"

[glyphs.dark-pages]
concept = "a page outline with a folded corner whose lower-right half is solid"
kind = "icon"
replaces = "color-mode"

[glyphs.main-file]
concept = "a page outline with a folded corner and a small solid star inside"
kind = "icon"
replaces = "target"

[glyphs.typst-file]
concept = "a page outline with a folded corner and a lowercase \"t\" inside"
kind = "icon"
replaces = "file-code"

[picks]
heading = "heading-2"
math-inline = "math-inline-1"
math-display = "math-display-2"
comment-toggle = "comment-toggle-2"
follow-cursor = "follow-cursor-2"
section = "section-1"
theme-light = "theme-light-2"
theme-dark = "theme-dark-2"
dark-pages = "dark-pages-1"
main-file = "main-file-2"
typst-file = "typst-file-2"

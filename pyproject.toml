[project]
name = "glyphy"
version = "0.1.0"
description = "Make icon glyphs that match a reference style: measure the style, generate drafts with an image model, trace, correct and verify them by measurement."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "cairosvg>=2.7",
  "potracer>=0.0.4",
  "tomli-w>=1.0",
  "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
glyphy = "glyphy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphy"]
